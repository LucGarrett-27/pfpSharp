<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PFP Sharp Login</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link type="text/css" rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="login-shell">



        <!-- Login content -->
        <main class="main-content">
            <div class="login-layout">

                <!-- Branding panel -->
                <section class="intro-panel">
                    <span class="eyebrow">Welcome Back</span>
                    <h1>
                        <img src="PFPSharpLogo.png" alt="Sharp Logo">
                        <img src="PFPSharp.png" alt="Sharp">
                    </h1>
                    <p>
                        Sign in to access the schedular, manage current schedules,
                        and input student data.
                    </p>
                    <div class="gold-divider"></div>
                </section>

                <!-- Login form -->
                <section class="login-card">
                    <h2>Sign In</h2>
                    <p class="login-subtitle">
                        Enter your credentials to continue.
                    </p>

                    <form id="loginForm">
                        <div class="mb-4">
                            <label for="email" class="form-label">
                                Email Address
                            </label>
                            <input type="email" class="form-control" id="email" name="email"
                                placeholder="you@example.com" autocomplete="username" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Password
                            </label>
                            <input type="password" class="form-control" id="password" name="password"
                                placeholder="Enter your password" autocomplete="current-password" required>
                        </div>

                        <button type="submit" class="btn btn-login w-100">
                            Sign In
                        </button>

                        <div id="formMessage" class="form-message" role="status">
                        </div>
                    </form>
                </section>

            </div>
        </main>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.getElementById("year").textContent =
            new Date().getFullYear();

        const loginForm = document.getElementById("loginForm");
        const formMessage = document.getElementById("formMessage");

        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();

            formMessage.style.display = "block";
            formMessage.className = "form-message text-danger";
            formMessage.textContent =
                "Login is not connected yet. Configure your authentication backend to sign in.";
        });
    </script>
</body>

</html>
